# Session timeout - 2 hours (in case of inactivity). The player refreshes this while open.
server.servlet.session.timeout=120m
# Keep the browser cookie long enough for the player heartbeat to renew an active session.
server.servlet.session.cookie.max-age=30d
# Unique cookie name to avoid conflicts between projects
server.servlet.session.cookie.name=JSESSIONID_M5
