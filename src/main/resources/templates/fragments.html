<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="sidebar(active)">
    <a class="logo" href="/home">Sekai Song</a>
    <nav>
        <a th:classappend="${active == 'home'} ? 'active'" href="/home">主页</a>
        <a th:classappend="${active == 'songs'} ? 'active'" href="/songs">歌曲库</a>
        <a th:classappend="${active == 'playlists'} ? 'active'" href="/playlists">歌单</a>
        <a th:classappend="${active == 'favorites'} ? 'active'" href="/favorites">收藏</a>
        <a th:classappend="${active == 'netease'} ? 'active'" href="/netease">网易云</a>
        <a th:classappend="${active == 'qq'} ? 'active'" href="/qq">QQ 音乐</a>
        <a th:classappend="${active == 'bilibili'} ? 'active'" href="/bilibili">B 站</a>
    </nav>
    <nav class="sidebar-bottom">
        <a th:classappend="${active == 'search'} ? 'active'" href="/search">搜索</a>
    </nav>
    <div class="user-box">
        <strong th:text="${loginUser.nickName}">Sekai</strong>
        <span class="account-mode">本地音乐库</span>
        <a href="/logout">退出</a>
    </div>
    <script th:src="@{/js/app-motion.js(v=20260830a)}" src="/js/app-motion.js?v=20260830a" defer></script>
</aside>
</body>
</html>
