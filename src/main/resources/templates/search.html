<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekai Song - 搜索</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=20260527e)}" href="/css/app.css?v=20260527e">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments :: sidebar('search')}"></div>
    <main class="content">
        <div class="section-title"><h1>搜索</h1><span>歌曲 / 歌单</span></div>
        <form class="search-bar" action="/search" method="get">
            <input name="q" th:value="${q}" placeholder="输入关键词">
            <button type="submit">搜索</button>
        </form>
        <div class="result-list">
            <a th:each="result : ${results}" th:href="${result.href}">
                <em th:text="${result.type}">类型</em>
                <strong th:text="${result.title}">标题</strong>
                <span th:text="${result.subtitle}">说明</span>
            </a>
            <p class="empty" th:if="${#lists.isEmpty(results)}">输入关键词后会显示匹配结果。</p>
        </div>
    </main>
</div>
</body>
</html>
