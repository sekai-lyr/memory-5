<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekai Song - 登录</title>
    <link rel="stylesheet" th:href="@{/css/auth.css(v=20260915g)}" href="/css/auth.css?v=20260915g">
    <link rel="stylesheet" th:href="@{/css/showcase-fold.css(v=20260915g)}" href="/css/showcase-fold.css?v=20260915g">
</head>
<body>
<main class="auth-page">
    <section class="brand-area" data-login-stage>
        <div th:replace="~{showcase :: showcase}"></div>
    </section>
    <section class="form-area">
        <div class="login-card">
            <div class="card-header">
                <span>?</span>
                <h2>欢迎回来</h2>
                <p>登录你的音乐宇宙</p>
            </div>
            <div class="server-message success" th:if="${message}" th:text="${message}"></div>
            <div class="server-message error" th:if="${error}" th:text="${error}"></div>
            <form id="loginForm" action="/user/login" method="post">
                <label for="userName">用户名</label>
                <div class="input-box">
                    <span>ID</span>
                    <input id="userName" name="userName" type="text" placeholder="请输入用户名" autocomplete="username" required>
                </div>
                <div class="error-text" id="userNameError"></div>
                <label for="password">密码</label>
                <div class="input-box">
                    <span>PW</span>
                    <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
                    <button type="button" id="togglePassword">显示</button>
                </div>
                <div class="error-text" id="passwordError"></div>
                <button class="primary-btn" type="submit">登录</button>
                <a class="secondary-btn" href="/register">创建账号</a>
            </form>
        </div>
    </section>
</main>
<script th:src="@{/js/showcase-fold.js(v=20260915f)}" src="/js/showcase-fold.js?v=20260915f"></script>
<script th:src="@{/js/login.js(v=20260914c)}" src="/js/login.js?v=20260914c"></script>
</body>
</html>
