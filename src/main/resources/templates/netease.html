<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekai Song - 网易云歌曲导入</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=20260527e)}" href="/css/app.css?v=20260527e">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments :: sidebar('netease')}"></div>
    <main class="content">
        <div class="section-title"><h1>网易云歌曲导入</h1><span>批量歌曲 ID</span></div>

        <section class="editor-panel">
            <div class="server-message success" th:if="${message}" th:text="${message}"></div>
            <div class="server-message error" th:if="${error}" th:text="${error}"></div>
            <form class="grid-form netease-song-import" th:action="@{/netease/import}" method="post">
                <label>
                    目标歌单
                    <select name="playlistId">
                        <option value="">网易云歌曲导入</option>
                        <option th:each="playlist : ${playlists}"
                                th:value="${playlist.id}"
                                th:text="${playlist.name}">SeKai</option>
                    </select>
                </label>
                <textarea name="songIds"
                          th:text="${songIds}"
                          placeholder="每行一个网易云歌曲 ID，也可以粘贴 song?id=xxx 链接或网络检查里复制出的 id 字段"></textarea>
                <button type="submit">导入歌曲</button>
            </form>
            <div class="import-help">
                <strong>现在按歌曲 ID 导入</strong>
                <span>歌单链接接口经常只能返回前几首，所以这里不再导入网易云歌单链接。</span>
                <span>从浏览器网络检查里复制歌曲 ID 后直接粘贴进来，系统会去读取单曲资料并加入你选择的歌单。</span>
                <span class="compliance-note">商业化使用时，请只导入你拥有合法使用权的内容；本系统不提供曲库售卖或公开分发服务。</span>
            </div>
        </section>

        <section class="editor-panel">
            <div class="section-title"><h2>单曲预览</h2><span>可选</span></div>
            <form class="search-bar" action="/netease" method="get">
                <input name="link" th:value="${link}" placeholder="粘贴一个网易云单曲链接用于预览">
                <button type="submit">预览</button>
            </form>
            <p class="empty" th:if="${neteaseLink.type == 'unknown' || neteaseLink.type == 'empty'}">
                支持 music.163.com/song?id=xxx 这样的单曲链接。
            </p>
            <iframe class="netease-player"
                    th:if="${neteaseLink.song && !#strings.isEmpty(neteaseLink.id)}"
                    th:src="@{'https://music.163.com/outchain/player?type=2&id=' + ${neteaseLink.id} + '&auto=0&height=66'}"
                    frameborder="0"
                    allow="autoplay; encrypted-media"></iframe>
        </section>
    </main>
</div>
</body>
</html>
