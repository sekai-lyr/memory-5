<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekai Song - 注册</title>
    <link rel="stylesheet" th:href="@{/css/auth.css(v=20260915g)}" href="/css/auth.css?v=20260915g">
    <link rel="stylesheet" th:href="@{/css/showcase-fold.css(v=20260915g)}" href="/css/showcase-fold.css?v=20260915g">
</head>
<body>
<main class="auth-page">
    <section class="brand-area" data-login-stage>
        <div th:replace="~{showcase :: showcase}"></div>
    </section>
    <section class="form-area">
        <div class="login-card register-card">
            <div class="card-header">
                <span>✦</span>
                <h2>创建账号</h2>
                <p>给你的动漫音乐收藏开一个新档案</p>
            </div>
            <div class="server-message error" th:if="${error}" th:text="${error}"></div>
            <form id="registerForm" action="/user/register" method="post">
                <label for="userName">用户名</label>
                <div class="input-box">
                    <span>ID</span>
                    <input id="userName" name="userName" type="text" placeholder="例如 sekai_listener" autocomplete="username" required>
                </div>
                <label for="nickName">昵称</label>
                <div class="input-box">
                    <span>NK</span>
                    <input id="nickName" name="nickName" type="text" placeholder="播放器里显示的名字" autocomplete="nickname">
                </div>
                <label for="password">密码</label>
                <div class="input-box">
                    <span>PW</span>
                    <input id="password" name="password" type="password" placeholder="至少 6 位" autocomplete="new-password" required>
                </div>
                <label for="confirmPassword">确认密码</label>
                <div class="input-box">
                    <span>PW</span>
                    <input id="confirmPassword" name="confirmPassword" type="password" placeholder="再输入一次" autocomplete="new-password" required>
                </div>
                <div class="error-text" id="registerError"></div>
                <button class="primary-btn" type="submit">注册</button>
                <a class="secondary-btn" href="/login">返回登录</a>
            </form>
        </div>
    </section>
</main>
<script th:src="@{/js/showcase-fold.js(v=20260915f)}" src="/js/showcase-fold.js?v=20260915f"></script>
<script th:src="@{/js/register.js(v=20260915e)}" src="/js/register.js?v=20260915e"></script>
</body>
</html>
